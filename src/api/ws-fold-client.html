<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Origami Live Fold — WebSocket Animation (v2.36)</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; background: #fafafa; }
    h1 { font-size: 20px; }
    .controls { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
    button { padding: 6px 14px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; }
    button:hover { background: #f0f0f0; }
    input[type=number] { width: 70px; padding: 4px; }
    select { padding: 4px; }
    .status { padding: 6px 10px; background: #eee; border-radius: 3px; font-size: 13px; }
    .status.connected { background: #d4edda; }
    .status.error { background: #f8d7da; }
    svg { display: block; background: #fff; border: 1px solid #eee; border-radius: 4px; }
    pre { background: #f5f5f5; padding: 8px; font-size: 11px; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <h1>📐 Origami Live Fold — WebSocket Animation</h1>

  <div class="controls">
    <label>Solver:
      <select id="solver">
        <option value="kinematic">kinematic (v2.27)</option>
        <option value="spring-mass">spring-mass (v2.28)</option>
        <option value="spring-mass-cyclic">spring-mass-cyclic (v2.29)</option>
      </select>
    </label>
    <label>Angle°: <input type="number" id="angle" value="90" min="0" max="180"></label>
    <label>Frames: <input type="number" id="frames" value="40" min="1" max="200"></label>
    <button id="start">▶ Start</button>
    <span id="status" class="status">disconnected</span>
  </div>

  <svg id="canvas" width="600" height="500" viewBox="0 0 600 500"></svg>
  <pre id="log"></pre>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const log = document.getElementById('log');
    const logLine = (s) => { log.textContent += s + '\n'; };

    // Demo FOLD: tetrahedron
    const FOLD = {
      file_spec: 1.1,
      vertices_coords: [[0, 0, 0], [10, 0, 0], [5, 10, 0], [5, 5, 5]],
      edges_vertices: [[0, 1], [1, 2], [2, 0], [0, 3], [1, 3], [2, 3]],
      edges_assignment: ['B', 'B', 'B', 'M', 'M', 'V'],
      faces_vertices: [[0, 1, 2], [0, 1, 3], [1, 2, 3], [2, 0, 3]],
    };

    function renderFrame(frame) {
      // Isometric projection: x → screen x, y → screen y, z → vertical offset
      const verts = frame.vertices.map(([x, y, z]) => ({ x: x, y: y - z * 0.5 }));
      // Compute bounds
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const v of verts) {
        minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
        minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
      }
      const pad = 30;
      const w = 600, h = 500;
      const scale = Math.min((w - 2 * pad) / Math.max(maxX - minX, 1),
                             (h - 2 * pad) / Math.max(maxY - minY, 1));
      const offX = pad + (w - 2 * pad - (maxX - minX) * scale) / 2;
      const offY = pad + (h - 2 * pad - (maxY - minY) * scale) / 2;
      const tx = (x) => offX + (x - minX) * scale;
      const ty = (y) => offY + (y - minY) * scale;

      let svg = '';
      // Faces
      for (const face of frame.faces) {
        if (face.length < 3) continue;
        const points = face.map(i => {
          const v = verts[i];
          return tx(v.x).toFixed(2) + ',' + ty(v.y).toFixed(2);
        }).join(' ');
        svg += '<polygon points="' + points + '" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5" opacity="0.7"/>';
      }
      // Edges
      for (let i = 0; i < frame.edges.length; i++) {
        const a = frame.edges[i][0], b = frame.edges[i][1];
        const v1 = verts[a], v2 = verts[b];
        const a_ = frame.edges_assignment[i] || 'B';
        let color = '#000', dash = 'none';
        if (a_ === 'M') { color = '#cc0000'; dash = '4,2'; }
        else if (a_ === 'V') { color = '#0033cc'; dash = '2,2'; }
        svg += '<line x1="' + tx(v1.x).toFixed(2) + '" y1="' + ty(v1.y).toFixed(2) +
               '" x2="' + tx(v2.x).toFixed(2) + '" y2="' + ty(v2.y).toFixed(2) +
               '" stroke="' + color + '" stroke-width="1.5" stroke-dasharray="' + dash + '"/>';
      }
      // Vertices
      for (const v of verts) {
        svg += '<circle cx="' + tx(v.x).toFixed(2) + '" cy="' + ty(v.y).toFixed(2) + '" r="2.5" fill="#000"/>';
      }
      canvas.innerHTML = svg;
    }

    document.getElementById('start').addEventListener('click', () => {
      const solver = document.getElementById('solver').value;
      const angle = parseFloat(document.getElementById('angle').value);
      const frames = parseInt(document.getElementById('frames').value);
      log.textContent = '';
      status.textContent = 'connecting...';
      status.className = 'status';

      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(proto + '//' + location.host + '/api/v1/ws/fold');

      ws.onopen = () => {
        status.textContent = 'connected';
        status.className = 'status connected';
        logLine('✓ WebSocket connected');
        ws.send(JSON.stringify({
          fold: FOLD,
          options: { solver, angle, frames, interval: 30 }
        }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'ack') {
          logLine('✓ Ack: solver=' + msg.solver + ' frames=' + msg.frames);
        } else if (msg.type === 'frame') {
          renderFrame(msg);
          if (msg.index % 5 === 0) logLine('  frame ' + msg.index + ' (' + Math.round(msg.percent * 100) + '%)');
        } else if (msg.type === 'done') {
          logLine('✓ Done: ' + msg.totalFrames + ' frames in ' + msg.computeTimeMs + 'ms');
          status.textContent = 'done';
          status.className = 'status';
        } else if (msg.type === 'error') {
          logLine('✗ Error: ' + msg.message);
          status.textContent = 'error';
          status.className = 'status error';
        }
      };

      ws.onerror = (err) => {
        logLine('✗ WebSocket error');
        status.textContent = 'error';
        status.className = 'status error';
      };

      ws.onclose = () => {
        logLine('✓ Connection closed');
        status.textContent = 'disconnected';
        status.className = 'status';
      };
    });
  </script>
</body>
</html>
